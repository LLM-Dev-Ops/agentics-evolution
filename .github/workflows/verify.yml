name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prompt-01:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: npm }
      - run: npm install --global npm@10.9.4
      - name: Verify pinned toolchain
        run: test "$(node --version)" = "v20.19.5" && test "$(npm --version)" = "10.9.4"
      - name: Install complete capability-test graph
        run: npm ci --ignore-scripts
      - name: Create independently anchored CI evidence identity
        shell: bash
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/evidence-private.pem"
          openssl pkey -in "$RUNNER_TEMP/evidence-private.pem" -pubout -out "$RUNNER_TEMP/evidence-public.pem"
          {
            echo 'AGENTICS_RELEASE_PRIVATE_KEY<<PRIVATE_EOF'
            cat "$RUNNER_TEMP/evidence-private.pem"
            echo 'PRIVATE_EOF'
            echo 'AGENTICS_RELEASE_PUBLIC_KEY<<PUBLIC_EOF'
            cat "$RUNNER_TEMP/evidence-public.pem"
            echo 'PUBLIC_EOF'
          } >> "$GITHUB_ENV"
      - run: npm run verify:prompt-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-01-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
  brain-local-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: ruvector-brain-local-9e12078a }
      - run: npm install --global npm@10.9.4
      - run: npm ci --ignore-scripts
      - run: npm run verify:brain-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-local-evidence-${{ github.sha }}
          path: reports/brain-local-build.json
          if-no-files-found: error
          retention-days: 30
