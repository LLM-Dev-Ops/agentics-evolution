name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prompt-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: npm }
      - run: npm install --global npm@10.9.4
      - run: npm ci --ignore-scripts
      - run: npm run verify:prompt-01
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prompt-01-evidence, path: reports/ }
